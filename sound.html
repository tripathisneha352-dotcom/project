<!DOCTYPE html>
<html>
<head>

<title>Ambient Sound Mixer</title>

<style>

body{
margin:0;
font-family:Arial;
color:white;
text-align:center;
background:linear-gradient(270deg,#020617,#0f172a,#1e293b);
background-size:600% 600%;
animation:bgMove 15s ease infinite;
overflow-x:hidden;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

h1{
padding:25px;
font-size:40px;
}

.sound-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
padding:30px;
}

.sound-card{
background:#1e293b;
border-radius:15px;
padding:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.5);
transition:0.3s;
}

.sound-card:hover{
transform:scale(1.07);
box-shadow:0 0 20px #22c55e;
}

.sound-card img{
width:100%;
height:150px;
object-fit:cover;
border-radius:10px;
}

.sound-card p{
margin:10px 0;
font-weight:bold;
}

.volume{
width:100%;
margin-top:8px;
}

.playBtn{
width:100%;
padding:8px;
margin-top:8px;
border:none;
border-radius:8px;
background:#22c55e;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.playBtn:hover{
background:#16a34a;
}

/* falling leaves */

.leaf{
position:fixed;
top:-50px;
font-size:24px;
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-50px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(100vh) rotate(360deg);
opacity:0;
}
}

</style>

</head>

<script>

let currentAudio=null;

document.querySelectorAll(".sound-card").forEach(card=>{

const audio=card.querySelector("audio");
const slider=card.querySelector(".volume");
const button=card.querySelector(".playBtn");

audio.volume=slider.value;

slider.addEventListener("input",()=>{
audio.volume=slider.value;
});

button.onclick=()=>{

if(currentAudio && currentAudio!==audio){
currentAudio.pause();
currentAudio.parentElement.querySelector(".playBtn").innerText="Play";
}

if(audio.paused){
audio.play();
button.innerText="Pause";
currentAudio=audio;
}else{
audio.pause();
button.innerText="Play";
}

};

});

/* Falling leaves */

function createLeaf(){

let leaf=document.createElement("div");
leaf.classList.add("leaf");
leaf.innerHTML="🍃";

leaf.style.left=Math.random()*100+"vw";
leaf.style.animationDuration=(Math.random()*5+5)+"s";

document.body.appendChild(leaf);

setTimeout(()=>{leaf.remove();},10000);

}

setInterval(createLeaf,600);

</script>
