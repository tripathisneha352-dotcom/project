  <p style="text-align:center;margin-top:2rem">
    <a href="index.html" class="glass-btn sm">← Back to StudySync</a>
  </p>

  <script>
    let currentAudio = null;

    document.querySelectorAll('.sound-card').forEach(card => {
      const audio = card.querySelector('audio');
      const slider = card.querySelector('.volume');
      const button = card.querySelector('.playBtn');

      if (!audio || !slider || !button) return;

      audio.volume = parseFloat(slider.value);

      slider.addEventListener('input', () => {
        audio.volume = parseFloat(slider.value);
      });

      button.addEventListener('click', async () => {
        if (currentAudio && currentAudio !== audio) {
          currentAudio.pause();
          const prevBtn = currentAudio.closest('.sound-card')?.querySelector('.playBtn');
          if (prevBtn) prevBtn.textContent = 'Play';
        }

        if (audio.paused) {
          try {
            await audio.play();
            button.textContent = 'Pause';
            currentAudio = audio;
          } catch (err) {
            console.error('Audio play failed:', err);
            button.textContent = 'Play';
          }
        } else {
          audio.pause();
          button.textContent = 'Play';
          if (currentAudio === audio) currentAudio = null;
        }
      });
    });
  </script>
